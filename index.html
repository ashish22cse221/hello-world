<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#850000;
}

/* Container stacks both images on top of each other */
.image-stack {
    position: relative;
    width: 100%;
    height: 100%;
}

/* Base image — fills the screen */
.img-base {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    animation: fadeInBase 2s ease-out forwards;
}

@keyframes fadeInBase {
    0% {
        opacity: 0;
        transform: scale(1.04);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Overlay image — transparent PNG slides in from top */
.img-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    object-fit: contain;
    object-position: top center;
    display: block;
    animation: slideInFromTop 2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    opacity: 0; /* hidden until animation starts */
}

@keyframes slideInFromTop {
    0% {
        transform: translateY(-110%);
        opacity: 0;
    }
    40% {
        opacity: 0.6;
    }
    75% {
        transform: translateY(4px);
        opacity: 1;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Bottom overlay — transparent PNG slides in from bottom */
.img-overlay-bottom {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: auto;
    object-fit: contain;
    object-position: bottom center;
    display: block;
    animation: slideInFromBottom 2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    opacity: 0;
    filter: drop-shadow(0 8px 24px rgba(255, 100, 150, 0.7))
            drop-shadow(0 0 40px rgba(255, 80, 130, 0.5))
            drop-shadow(0 0 80px rgba(255, 120, 160, 0.3));
}

@keyframes slideInFromBottom {
    0% {
        transform: translateX(-50%) translateY(110%);
        opacity: 0;
    }
    40% {
        opacity: 0.6;
    }
    75% {
        transform: translateX(-50%) translateY(-4px);
        opacity: 1;
    }
    100% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}
</style>
</head>
<body>

<div class="image-stack">
    <!-- Background image -->
    <img src="images/1.png" alt="Background Photo" class="img-base">
    <!-- Transparent PNG overlay slides in from top -->
    <img src="images/2.png" alt="Overlay Photo" class="img-overlay">
    <!-- Transparent PNG overlay slides in from bottom -->
    <img src="images/v.png" alt="Bottom Overlay" class="img-overlay-bottom">
</div>

<script>
    setTimeout(function() {
        window.location.href = 'gallery.html';
    }, 8000);
</script>

</body>
</html>
